id: sales-cost-estimate-quotation
title: 多工厂成本测算与报价建议
domain: sales
status: best-practice
owner: Fanfan
updated: 2026-11-04
industry: 制造业
products: [YonWork, YonBIP]
system: YonBIP
visual: compare

summary: 输入订单即比较各工厂的生产加运费总成本，参考历史订单给出两套报价方案

description: >
  多工厂制造企业接到新订单，要决定用哪家工厂生产、报什么价：报高了可能丢单，报低了利润太薄。所需信息分散在三个部门：生产有BOM和工时，物流有运费，财务有历史订单毛利。通常要人工逐个部门收集再测算，客户只能等，成本项也容易漏算。

pain_points:
  - title: 多工厂成本难比较
    detail: 各工厂BOM、工时与费率不同，手工逐项测算耗时
  - title: 物流成本常被漏算
    detail: 只比生产成本，漏掉工厂到收货地的运费差异
  - title: 报价缺少依据
    detail: 历史毛利和交期数据分散，报价凭经验，难兼顾价格与交期

flow:
  - step: 发起成本测算
    lane: user
    note: 输入订单号，要求比较各工厂
  - step: 读取BOM与费率
    lane: erp
    note: 产品BOM、工艺路线、物流费率
    edge: 订单号
  - step: 测算各厂成本
    lane: ai
    note: 逐项算料工费，说明差异原因和降本建议
    edge: 成本数据
  - step: 比较总成本
    lane: ai
    type: decision
    note: 叠加运费后，找出总成本最低的工厂
  - step: 给出报价方案
    lane: ai
    note: 参考历史订单的毛利和交期，给出两套报价
    edge: 历史订单
  - step: 确认工厂与报价
    lane: user
    note: 按客户更看重价格还是交期，选定工厂和报价
    edge: 报价方案

en:
  title: Multi-factory Costing & Quoting
  industry: Manufacturing
  summary: "Enter an order to compare each factory's total cost with freight, and get two quote options"
  description: >
    A multi-factory manufacturer gets a new order and must choose a factory and a price. Quote too high and it may lose the deal; too low and the margin is thin. The data sits in three departments: production has the BOM and labour hours, logistics the freight rates, finance the past margins. Collecting it takes time while the customer waits, and costs get missed.
  pain_points:
    - title: Factories hard to compare
      detail: Each factory has its own BOM, labour hours and rates; costing by hand is slow
    - title: Logistics cost missed
      detail: Only production cost is compared, not freight from factory to delivery city
    - title: Quotes lack a basis
      detail: Past margins and lead times are scattered, so quotes rely on experience
  flow:
    - step: User starts costing
      lane: user
      note: Enters the order number and asks to compare factories
    - step: Read BOM and rates
      lane: erp
      note: Product BOM, routing and logistics rates
      edge: Order no.
    - step: Cost each factory
      lane: ai
      note: Costs materials, labour and overhead, explains gaps and how to cut cost
      edge: Cost data
    - step: Compare total cost
      lane: ai
      type: decision
      note: Adds freight and finds the factory with the lowest total cost
    - step: Suggest two quotes
      lane: ai
      note: Gives two quote options based on past margins and lead times
      edge: Past orders
    - step: Confirm factory & quote
      lane: user
      note: Chooses by whether the customer values price or lead time more
      edge: Quote options
