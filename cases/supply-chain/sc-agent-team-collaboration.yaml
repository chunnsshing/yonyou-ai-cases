id: sc-agent-team-collaboration
title: 供应链智能体团队协作
domain: supply-chain
status: best-practice
owner: Fanfan
updated: 2026-11-04
industry: 通用
products: [YonWork, YonSuite]
system: YonSuite
visual: team

summary: 用户只交一个任务，主管智能体分派给销售、采购、生产智能体，协作完成并汇总报告

description: >
  交付订单要靠销售、采购、生产配合，很多订单同时在跑。一张单延误时，各部门只看到自己那一段，要有人逐个部门追问、再汇总成报告。谁来跟进、有多急、延误会带来什么后果，也容易漏看。

pain_points:
  - title: 各部门只看自己那段
    detail: 销售、采购、生产订单分开查，没人看得到全貌
  - title: 逾期靠人逐个追
    detail: 要一个部门一个部门地问，再手工汇总
  - title: 跟进责任不清
    detail: 查出问题后，谁来跟进、有多急缺少统一安排
  - title: 延误后果易被漏看
    detail: 采购晚了会影响生产和客户订单，单看一个部门看不出

flow:
  - step: 用户下达任务
    lane: user
    note: 在对话中交一个订单执行分析任务
  - step: 查询订单数据
    lane: erp
    note: 销售、采购、生产订单明细
    edge: 任务
  - step: 分析订单状态
    lane: ai
    note: 主管智能体找出未交付、逾期和异常订单
    edge: 订单明细
  - step: 判断分派任务
    lane: ai
    type: decision
    note: 按问题交给销售、采购、生产智能体
  - step: 智能体回报结果
    lane: ai
    note: 各智能体完成后把结果交回主管
    edge: 分派任务
  - step: 汇总执行报告
    lane: ai
    note: 列出问题、负责人、优先级和风险，存入交付物中心
    edge: 回报结果

en:
  title: Supply Chain Agent Team
  industry: General
  summary: "Hand over one task: a lead agent assigns sales, purchasing and production agents, then reports"
  description: >
    Delivering orders takes sales, purchasing and production working together, with many orders running at once. When an order is delayed, each department sees only its own part, so someone has to chase each one and put a report together. Who should follow up, how urgently, and what the delay could lead to are easy to miss.
  pain_points:
    - title: Teams see only their part
      detail: Sales, purchase and production orders are checked separately; no one sees it all
    - title: Chasing overdue by hand
      detail: Someone has to ask each department, then compile the results by hand
    - title: Unclear follow-up
      detail: Once issues are found, who follows up and how urgently isn’t set out
    - title: Knock-on effects missed
      detail: A late purchase can hold up production and customer orders
  flow:
    - step: User gives the task
      lane: user
      note: Hands over one order execution analysis task in chat
    - step: Query order data
      lane: erp
      note: Sales, purchase and production order details
      edge: Task
    - step: Analyse order status
      lane: ai
      note: Lead agent finds undelivered, overdue and abnormal orders
      edge: Order details
    - step: Decide on handoffs
      lane: ai
      type: decision
      note: Passes each issue to the sales, purchasing or production agent
    - step: Agents report back
      lane: ai
      note: Each agent returns its results to the lead agent
      edge: Handoff
    - step: Consolidate the report
      lane: ai
      note: Issues, person in charge, priority and risks; saved to Deliverables
      edge: Results
