id: sc-procurement-analysis
title: 采购分析助理
domain: supply-chain
status: best-practice
owner: Fanfan
updated: 2026-11-04
industry: 通用
products: [YonWork, YonBIP]
system: YonBIP
visual: radar

summary: 一句话分析采购支出和供应商结构，给出健康评分、风险原因和分阶段行动计划

description: >
  采购往往是企业最大的支出之一。要判断采购支出是否健康——钱是否过度集中在少数供应商和品类、采购是否走合同、供应商是否按时交付——需要从不同系统取数、整理再分析，很花时间，往往需要时拿不到结果，只能隔一段时间做一次。

pain_points:
  - title: 数据分散难汇总
    detail: 支出、供应商与履约数据分在不同系统，整理耗时
  - title: 集中风险看不出
    detail: 钱过度集中在一两家供应商，涨价或延迟交付时没有备选
  - title: 合同外采购难管控
    detail: 不走合同的采购，价格和条款没有事先约定，难以控制
  - title: 只能定期做
    detail: 分析靠人工整理，需要时往往拿不到结果

flow:
  - step: 提出分析需求
    lane: user
    note: 选支出、供应商或履约分析，或直接提问
  - step: 汇总采购数据
    lane: erp
    note: 采购支出、订单履约与供应商数据
    edge: 分析主题
  - step: 计算健康指标
    lane: ai
    note: 供应商集中度、合同外采购等指标加权评分
    edge: 多源数据
  - step: 判断风险等级
    lane: ai
    type: decision
    note: 总分低于60分即判为高风险
  - step: 生成分析报告
    lane: ai
    note: 风险原因、紧急措施和分阶段行动计划
  - step: 决定改进措施
    lane: user
    note: 可继续追问，再决定是否调整供应商
    edge: 分析报告

en:
  title: Procurement Analysis Assistant
  industry: General
  summary: Ask in one sentence to analyse spend and suppliers; get a score, root causes and a plan
  description: >
    Procurement is often one of a company's biggest costs. Checking whether the spend is healthy (not too concentrated on a few suppliers or goods, bought under contract, delivered on time) means pulling data from different systems and putting it together. That takes time, so the answer is often not ready when needed and the check is done only once in a while.
  pain_points:
    - title: Data hard to pull together
      detail: Spend, supplier and fulfilment data sit in different systems; compiling is slow
    - title: Concentration risk unseen
      detail: "Spend sits with 1-2 suppliers: no backup if prices rise or delivery slips"
    - title: Off-contract buying
      detail: Without a contract, prices and terms aren’t agreed upfront, so hard to control
    - title: Only done now and then
      detail: Analysis is compiled by hand, so results often aren’t ready when needed
  flow:
    - step: User asks
      lane: user
      note: Picks spend, supplier or fulfilment analysis, or just asks
    - step: Gather procurement data
      lane: erp
      note: Spend, order fulfilment and supplier data
      edge: Topic
    - step: Score health metrics
      lane: ai
      note: Weighted score from supplier concentration, off-contract buying and more
      edge: Multi-source
    - step: Rate the risk
      lane: ai
      type: decision
      note: A total score below 60 is rated high risk
    - step: Write the report
      lane: ai
      note: Root causes, urgent actions and a phased action plan
    - step: Decide next steps
      lane: user
      note: Asks follow-up questions, then decides on supplier changes
      edge: Report
