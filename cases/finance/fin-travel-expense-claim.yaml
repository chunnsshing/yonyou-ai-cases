id: fin-travel-expense-claim
title: 出差费用预估与报销
domain: finance
status: demo
owner: Fanfan
updated: 2026-10-29
industry: 通用
products: [YonWork, YonBIP]
system: YonBIP
demo_video:
  - path: videos/fin-travel-expense-claim/01-travel-request.mp4
    label: 出差申请
    label_en: Travel Request
  - path: videos/fin-travel-expense-claim/02-reimbursement.mp4
    label: 费用报销
    label_en: Reimbursement

summary: 出差申请自动预估费用，报销单据AI自动整理并提交，人工只需核对

description: >
  员工出差需手动填报出差信息并预估费用，要查很多数据；出差回来报销时因涉及多币种，需到财务指定网站查汇率，
  把单据币种换算成记账币种，并按财务要求格式为每张单据填写备注，单据多时非常耗时。

pain_points:
  - title: 预估费用靠查数据
    detail: 申请时需手动查很多数据才能预估出差费用
  - title: 多币种换算繁琐
    detail: 需到财务指定网站逐单查汇率并换算记账币种
  - title: 备注格式要求严
    detail: 每张单据需按财务要求格式手动填写备注
  - title: 单据多耗时长
    detail: 出差单据多时，逐单核对与填写非常耗时

flow:
  - step: 员工发起出差
    lane: user
    note: 出差地点与时间
  - step: 预填申请与预估
    lane: ai
    note: 查询所需数据，预估出差费用
    edge: 出差需求
  - step: 出差并收集单据
    lane: user
    note: 各类票据，常涉及多币种
  - step: 整理报销信息
    lane: ai
    note: 按财务指定汇率换算，按格式写备注
    edge: 票据
  - step: 员工核对
    lane: user
    note: 只确认整理好的信息
    edge: 报销草稿
  - step: 提交报销单
    lane: erp
    note: 确认后直接生成报销单
    edge: 确认

en:
  title: Travel Estimate & Expense Claim
  industry: General
  summary: Auto-estimate costs; AI organizes and submits claims — staff just review
  description: >
    Employees manually fill in trip details and estimate costs by researching data themselves. Expense claims
    after the trip involve multiple currencies — staff look up rates on the finance team's site, convert each
    receipt to the functional currency, and write remarks in the required format for every receipt, which is
    slow when there are many receipts.
  pain_points:
    - title: Manual cost estimation
      detail: Estimating trip costs requires manually researching a lot of data
    - title: Tedious FX conversion
      detail: Staff look up rates on the finance site and convert each receipt one by one
    - title: Strict remark format
      detail: Every receipt needs a remark written in the finance team's required format
    - title: Slow at volume
      detail: Checking and filling in many receipts one by one takes a long time
  flow:
    - step: Request a trip
      lane: user
      note: Destination and dates
    - step: Pre-fill & estimate
      lane: ai
      note: Looks up the data, estimates trip cost
      edge: Trip details
    - step: Travel, keep receipts
      lane: user
      note: Receipts, often in several currencies
    - step: Organize the claim
      lane: ai
      note: Finance's FX rates; remarks in the required format
      edge: Receipts
    - step: Traveler reviews
      lane: user
      note: Confirms what was prepared
      edge: Draft claim
    - step: Submit claim
      lane: erp
      note: Created directly once confirmed
      edge: Confirmed
