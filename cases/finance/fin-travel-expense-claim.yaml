id: fin-travel-expense-claim
title: 出差费用预估与报销
domain: finance
status: demo
owner: Fanfan
updated: 2026-09-26
industry: 通用
client: ""
products: [YonWork]

summary: 出差申请自动预估费用，报销单据AI自动整理并提交，人工只需核对

description: >
  员工出差需手动填报出差信息并预估费用，要查很多数据；出差回来报销时因涉及多币种，需到财务指定网站查汇率，
  把单据币种换算成记账币种，并按财务要求格式为每张单据填写备注，单据多时非常耗时。

pain_points:
  - title: 预估费用靠查数据
    detail: 申请时需手动查很多数据才能预估出差费用
  - title: 多币种换算繁琐
    detail: 需到财务指定网站逐单查汇率并换算记账币种
  - title: 备注格式要求严
    detail: 每张单据需按财务要求格式手动填写备注
  - title: 单据多耗时长
    detail: 出差单据多时，逐单核对与填写非常耗时

flow:
  - step: 提交出差申请
    role: 出差员工
    ai: 自动查询相关数据，预填出差信息与预估费用
  - step: 出差执行
    role: 出差员工
  - step: 提供出差单据
    role: 出差员工
  - step: 整理报销信息
    ai: 自动换算汇率、生成备注，整理好报销信息
  - step: 人工核对信息
    role: 出差员工
  - step: 提交至系统
    ai: 核对无误后AI自动填写并提交报销单据，无需人工操作

en:
  title: Travel Estimate & Expense Claim
  industry: General
  summary: Auto-estimate costs; AI organizes and submits claims — staff just review
  description: >
    Employees manually fill in trip details and estimate costs by researching data themselves. Expense claims
    after the trip involve multiple currencies — staff look up rates on the finance team's site, convert each
    receipt to the functional currency, and write remarks in the required format for every receipt, which is
    slow when there are many receipts.
  pain_points:
    - title: Manual cost estimation
      detail: Estimating trip costs requires manually researching a lot of data
    - title: Tedious FX conversion
      detail: Staff look up rates on the finance site and convert each receipt one by one
    - title: Strict remark format
      detail: Every receipt needs a remark written in the finance team's required format
    - title: Slow at volume
      detail: Checking and filling in many receipts one by one takes a long time
  flow:
    - step: Submit trip request
      role: Traveler
      ai: Auto-research data and pre-fill trip info and estimated cost
    - step: Take the trip
      role: Traveler
    - step: Provide trip receipts
      role: Traveler
    - step: Organize claim details
      ai: Auto-convert currency, generate remarks, and organize the claim details
    - step: Staff review
      role: Traveler
    - step: Submit to system
      ai: Once confirmed, AI fills in and submits the claim — no manual entry needed
