# 全站配置：页签（领域）、状态标签、品牌。改这里即可全局生效。
# 中英双语：name / name_en 等成对出现；页面按 L 键切换语言
title: YonWork 场景案例库
title_en: YonWork Use Case Library
subtitle: Yonyou Singapore · YonWork 场景案例库
subtitle_en: Yonyou Singapore · YonWork Use Case Library
brand_color: "#E50014"      # 主色，取自官方 logo 红色
logo: assets/logo.png        # 官方 logo（透明底），构建时自动内嵌
default_lang: zh             # 默认语言 zh / en
bold_owner: Elmond           # 只有这位负责人的场景标题加粗，其他人的场景标题为常规字重

# 领域 = 首页页签，顺序即显示顺序。id 必须与 cases/ 下的文件夹名一致
domains:
  - id: finance
    name: 财务
    name_en: Finance
  - id: supply-chain
    name: 供应链
    name_en: Supply Chain
  - id: manufacturing
    name: 制造
    name_en: Manufacturing
  - id: hr
    name: 人力
    name_en: HR
  - id: sales
    name: 销售
    name_en: Sales
  - id: analytics
    name: 经营分析
    name_en: Analytics

# 场景状态标签（固定5种），顺序即图例顺序
statuses:
# 对外显示的名称面向客户（公开网站）；id 和内部含义不变，见每条的注释。
# public: false = 只在内部跟踪（yaml 里照常填写），网站上不显示该标签，也不出现在筛选里。
  - id: ready                # 内部：videos/<场景id>/ 里有视频或 HTML，构建自动加上，无需写进 yaml
    name: 观看演示
    name_en: Watch Demo
    color: "#DB2777"
    desc: 可直接观看演示视频或示例看板
    desc_en: A demo video or sample dashboard is available to view
  - id: delivered            # 内部：已在客户现场上线交付
    name: 客户已上线
    name_en: Live at Clients
    color: "#16A34A"
    desc: 已在客户业务中上线运行
    desc_en: Running in production at client sites
  - id: replicable           # 内部：方案成熟，可直接复制到其他客户
    public: false
    name: 成熟方案
    name_en: Proven
    color: "#2563EB"
    desc: 成熟方案，可快速部署到您的业务
    desc_en: A proven solution that can be rolled out to your business quickly
  - id: demo                 # 内部：有可演示的 Demo 环境
    public: false
    name: 可预约演示
    name_en: Demo Available
    color: "#7C3AED"
    desc: 可预约现场或线上演示
    desc_en: Book a live demo with our team
  - id: to-verify            # 内部：开发中，尚不能演示
    public: false
    name: 按需定制
    name_en: Tailored
    color: "#D97706"
    desc: 结合您的流程与数据定制交付
    desc_en: Configured to your processes and data as part of delivery
  - id: future               # 内部：方向性构想，需技术/业务验证
    public: false
    name: 联合共创
    name_en: Co-innovation
    color: "#0891B2"
    desc: 与客户共同设计、联合落地的创新场景
    desc_en: Designed and built together with clients
