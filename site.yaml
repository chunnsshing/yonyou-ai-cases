# 全站配置：页签（领域）、状态标签、品牌。改这里即可全局生效。
# 中英双语：name / name_en 等成对出现；页面按 L 键切换语言
title: AI 场景案例库
title_en: AI Use Case Library
subtitle: Yonyou Singapore · AI 场景案例库
subtitle_en: Yonyou Singapore · AI Use Case Library
brand_color: "#E50014"      # 主色，取自官方 logo 红色
logo: assets/logo.png        # 官方 logo（透明底），构建时自动内嵌
default_lang: zh             # 默认语言 zh / en

# 领域 = 首页页签，顺序即显示顺序。id 必须与 cases/ 下的文件夹名一致
domains:
  - id: finance
    name: 财务
    name_en: Finance
  - id: supply-chain
    name: 供应链
    name_en: Supply Chain
  - id: manufacturing
    name: 制造
    name_en: Manufacturing
  - id: hr
    name: 人力
    name_en: HR
  - id: sales
    name: 销售
    name_en: Sales

# 场景状态标签（固定5种），顺序即图例顺序
statuses:
  - id: delivered
    name: 已交付
    name_en: Delivered
    color: "#16A34A"
    desc: 已在客户现场上线交付
    desc_en: Live at a client site
  - id: replicable
    name: 可复制
    name_en: Replicable
    color: "#2563EB"
    desc: 方案成熟，可直接复制到其他客户
    desc_en: Proven solution, ready to roll out to other clients
  - id: demo
    name: 可Demo
    name_en: Demo Ready
    color: "#7C3AED"
    desc: 有可演示的Demo环境
    desc_en: A working demo environment is available
  - id: to-verify
    name: 待验证
    name_en: To Verify
    color: "#D97706"
    desc: 方案已设计，需技术/业务验证
    desc_en: Designed; needs technical or business validation
  - id: future
    name: 未来可能
    name_en: Future
    color: "#0891B2"
    desc: 方向性构想，依赖产品或技术演进
    desc_en: Directional idea, depends on product or technology evolution
